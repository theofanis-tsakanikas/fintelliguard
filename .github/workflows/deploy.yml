name: Deploy

# GATED + DEFERRED: manual dispatch only. Runs the ORDERED apply sequence across layers.
# Each layer consumes the previous layer's remote-state outputs, so order matters:
#   1. infra/aws            (VPC, KMS, S3, Secrets, IAM)
#   2. infra/databricks     (workspace + Unity Catalog) — consumes infra/aws
#   3. agents/bedrock/terraform (agent, KB, guardrail, action-group Lambda) — consumes infra/aws
#   4. infra/bundles        (DABs: DLT + serving + vector search + agent + grants)
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  contents: read

jobs:
  deploy:
    name: Apply all layers (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }} # GitHub environment protection / approvals
    env:
      AWS_REGION: eu-central-1
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      TF_VAR_databricks_account_id: ${{ secrets.DATABRICKS_ACCOUNT_ID }}
      TF_VAR_databricks_client_id: ${{ secrets.DATABRICKS_CLIENT_ID }}
      TF_VAR_databricks_client_secret: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: eu-central-1
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - uses: databricks/setup-cli@main

      - name: 1) infra/aws
        working-directory: infra/aws
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false

      - name: 2) infra/databricks
        working-directory: infra/databricks
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false

      - name: 3) agents/bedrock/terraform
        working-directory: agents/bedrock/terraform
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false

      - name: 4) infra/bundles (Databricks Asset Bundles)
        working-directory: infra/bundles
        run: databricks bundle deploy -t ${{ inputs.environment }}
