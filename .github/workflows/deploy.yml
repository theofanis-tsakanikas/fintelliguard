name: Deploy

# GATED + DEFERRED: manual dispatch only. Runs the ORDERED apply sequence across layers.
# Each layer consumes the previous layer's remote-state outputs, so order matters:
#   1. infra/aws            (VPC, KMS, S3, Secrets, IAM)
#   2. infra/databricks     (workspace + Unity Catalog) — consumes infra/aws
#   3. agents/bedrock/terraform (agent, KB, guardrail, action-group Lambda) — consumes infra/aws
#   4. infra/bundles        (DABs: DLT + serving + vector search + agent + grants)
#
# This workflow used to run three consecutive `terraform apply -auto-approve` with no
# `terraform plan` anywhere, on long-lived IAM user keys, with no dependency on CI, from
# any branch. CLAUDE.md's rule is "always plan before apply; never apply without reviewing
# the plan" — the `environment:` gate approved a commit SHA, not a diff, because GitHub
# environment approval fires before the first step runs.
#
# It is now two jobs. `plan` renders every layer's diff and uploads it. `apply` requires
# the environment approval, downloads THAT plan, and applies exactly it. The approver sees
# what they are approving.
on:
  workflow_dispatch:
    inputs:
      # `prod` used to be offered here. `infra/bundles/databricks.yml` declares only a
      # `dev` target, so step 4 failed on prod AFTER three layers had already applied —
      # a partial deploy with no rollback. It is not offered until a prod target exists.
      environment:
        description: Target environment
        type: choice
        options: [dev]
        default: dev

permissions:
  contents: read
  id-token: write # OIDC — short-lived credentials, no stored AWS keys

# Two dispatches racing would both apply. The DynamoDB lock protects Terraform state, but
# nothing protects `databricks bundle deploy`.
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  TF_LAYERS: infra/aws infra/databricks agents/bedrock/terraform

jobs:
  # The deployed artifact must be the validated one. Without this the workflow could apply
  # code that fails lint, the red-team gate, or gate_proof — the Responsible-AI gates were
  # enforced on PRs only, never on what actually shipped.
  validate:
    name: Re-run the gates on the deploying ref
    uses: ./.github/workflows/ci.yml

  # Plans the FOUNDATION layer only, and uploads the diff as TEXT for the approver to read.
  #
  # Two things this deliberately does not do, both learned the hard way:
  #
  # 1. It does not plan every layer. `infra/databricks` and `agents/bedrock/terraform` read
  #    `data.terraform_remote_state.aws`, so before `infra/aws` has applied those outputs do
  #    not exist and the plan fails on "Unsupported attribute". Plan-all-then-apply-all
  #    cannot work on a first deploy, or on any deploy that changes an upstream output.
  # 2. It does not upload the BINARY plan. A `.tfplan` stores every variable value verbatim,
  #    including `sensitive = true` ones — `sensitive` redacts console output, not the file.
  #    Uploading it published `DATABRICKS_CLIENT_SECRET` in cleartext to anyone with repo
  #    read, for five days, recoverable with `terraform show -json tfplan`. The text render
  #    honours `sensitive`; the file does not.
  plan:
    name: Plan the foundation layer (${{ inputs.environment }})
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: fintelliguard-plan

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false

      - name: Plan infra/aws and render it for review
        run: |
          set -euo pipefail
          terraform -chdir=infra/aws init -input=false -lockfile=readonly
          terraform -chdir=infra/aws plan -input=false -out=tfplan
          # `show` respects `sensitive`; the .tfplan file it reads does not. Only this
          # render leaves the runner.
          terraform -chdir=infra/aws show -no-color tfplan | tee infra/aws/plan.txt
          rm -f infra/aws/tfplan

      - name: Upload the plan text for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: plan-${{ inputs.environment }}-${{ github.sha }}
          path: infra/aws/plan.txt
          retention-days: 5
          if-no-files-found: error

  apply:
    name: Apply, layer by layer (${{ inputs.environment }})
    needs: plan
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }} # the approval gate — the plan text is the artifact
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: fintelliguard-apply

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false

      - uses: databricks/setup-cli@dd60b7b133203edca3e8f08b1e053c43a979296e # v1.8.0

      # Pinned to the version the gates run on. The corpus loader further down is repo code,
      # so leaving it to whatever interpreter the runner image happens to ship would mean the
      # deploy executes a Python that CI never validated against.
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      # PER-LAYER plan -> apply, in dependency order. Each layer's plan is computed AFTER
      # the layer it depends on has applied, which is the only order that can work: layers 2
      # and 3 read layer 1's remote-state outputs, and those do not exist until layer 1 runs.
      #
      # Each `plan -out` / `apply tfplan` pair lives entirely on the runner and the plan file
      # is deleted immediately — so what applies is exactly what was just planned, and the
      # file that carries the secrets never leaves the machine. Every diff is printed here
      # for the record; the approver read layer 1's before approving this job.
      # A secret scheduled for deletion still OWNS its name, and Secrets Manager refuses to
      # create another one with it:
      #
      #     InvalidRequestException: You can't create this secret because a secret with this
      #     name is already scheduled for deletion.
      #
      # `secret_recovery_window_days = 0` in dev.auto.tfvars stops NEW teardowns from parking
      # secrets in limbo, but it cannot help an estate already torn down under the old 7-day
      # default — which is what failed run 29706126775, and only after MSK had spent 26
      # minutes creating. Without this step that deploy is blocked for a week.
      #
      # Scoped twice over, because force-deleting a secret is irreversible: only names under
      # THIS project and environment's prefix, and only ones already scheduled for deletion.
      # A live secret has no DeletedDate and is never touched.
      - name: Purge secrets left pending deletion by a previous teardown
        env:
          PREFIX: fintelliguard/${{ inputs.environment }}/
        run: |
          set -euo pipefail
          pending="$(aws secretsmanager list-secrets --include-planned-deletion \
            --query "SecretList[?DeletedDate!=null && starts_with(Name, '${PREFIX}')].Name" \
            --output text)"
          if [ -z "${pending}" ]; then
            echo "no secrets pending deletion under ${PREFIX}"
            exit 0
          fi
          for name in ${pending}; do
            echo "purging ${name} (scheduled for deletion, blocks re-creation)"
            aws secretsmanager delete-secret --secret-id "${name}" \
              --force-delete-without-recovery >/dev/null
          done

      - name: Apply every layer, in dependency order
        env:
          TF_VAR_databricks_account_id: ${{ secrets.DATABRICKS_ACCOUNT_ID }}
          TF_VAR_databricks_client_id: ${{ secrets.DATABRICKS_CLIENT_ID }}
          TF_VAR_databricks_client_secret: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          for dir in ${TF_LAYERS}; do
            echo "::group::${dir}"
            terraform -chdir="${dir}" init -input=false -lockfile=readonly
            terraform -chdir="${dir}" plan -input=false -out=tfplan
            terraform -chdir="${dir}" show -no-color tfplan
            terraform -chdir="${dir}" apply -input=false tfplan
            rm -f "${dir}/tfplan"
            echo "::endgroup::"
          done

      # Bedrock creates the Knowledge Base, the bucket and the data source — and leaves all
      # three EMPTY. Terraform has no resource for "the documents", so without this step a
      # deploy finishes with the KB `ACTIVE` and zero objects in it, which is precisely what
      # a post-deploy health check found. Tier 2 grounds every verdict in retrieved
      # regulatory text; there was none to retrieve.
      #
      # `docs/DEPLOY.md` used to carry this as a manual `aws s3 cp ... --recursive`, against
      # CLAUDE.md's "IaC only. No console deployments, ever." Worse, that command bypasses
      # `screen_document()` entirely, while `docs/governance/AI_ACT_ANNEX_IV.md` states as
      # regulated fact that the corpus IS screened at ingestion. The module below is the only
      # loader now, and it uploads the SCREENED text rather than the files on disk — a screen
      # you can walk around by using a different upload command is not a control.
      #
      # Ids come from the layer that owns them, never pasted.
      - name: Load the regulatory corpus into the Knowledge Base (screened)
        run: |
          set -euo pipefail
          cd agents/bedrock/terraform
          bucket="$(terraform output -raw kb_docs_bucket)"
          kb="$(terraform output -raw knowledge_base_id)"
          ds="$(terraform output -raw data_source_id)"
          cd "$GITHUB_WORKSPACE"
          python -m pip install --quiet boto3
          python -m agents.bedrock.kb.ingest \
            --bucket "${bucket}" --knowledge-base-id "${kb}" --data-source-id "${ds}" \
            --region "${AWS_REGION}"

      # The workspace host cannot be a hand-pasted secret: the workspace does not exist
      # until layer 2 applies, and its URL is assigned by Databricks at creation. Pasting it
      # meant the first deploy could only ever fail, and every later one silently trusted a
      # value nothing kept in sync with the workspace actually deployed. Read it from the
      # layer that creates it.
      - name: Resolve the workspace host from layer 2's output
        run: |
          set -euo pipefail
          host="$(terraform -chdir=infra/databricks output -raw workspace_url)"
          case "${host}" in https://*) ;; *) host="https://${host}" ;; esac
          echo "DATABRICKS_HOST=${host}" >> "$GITHUB_ENV"
          echo "workspace host: ${host}"

      # Authenticates as the SERVICE PRINCIPAL (OAuth M2M), not a PAT. The principal already
      # exists — the Terraform layers above run as it. A PAT would be a second, longer-lived
      # credential for the same identity, minted by hand, rotated by nobody.
      # 4a) The prerequisite the main bundle cannot express.
      #
      # `resources/vector_search.yml` builds a DELTA_SYNC index over `gold.resolved_cases`,
      # and Databricks refuses to create an index whose source table does not exist. DAB
      # deploys everything in one pass with no way to say "run this job, then build that
      # index", so the ordering lives here: seed the table, THEN deploy the bundle that
      # indexes it.
      - name: 4a) Seed gold.resolved_cases (prerequisite for the case index)
        working-directory: infra/bundles/prereq
        env:
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          databricks bundle deploy -t ${{ inputs.environment }}
          databricks bundle run -t ${{ inputs.environment }} seed_resolved_cases

      # Creating the endpoint is not the same as having one. `bundle deploy` returns as soon
      # as Databricks accepts the request, and a Vector Search endpoint then spends minutes
      # PROVISIONING — during which the main bundle's index creation fails with
      #
      #     NOT_FOUND: AI Search endpoint fintelliguard-cases not found.
      #
      # which reads like a naming or permissions problem and is neither. Polling for ONLINE
      # is the ordering DAB cannot express, in the only place that can express it.
      - name: 4a-ii) Wait for the Vector Search endpoint to be ONLINE
        env:
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          ENDPOINT: fintelliguard-cases
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            state="$(databricks vector-search-endpoints get-endpoint "${ENDPOINT}" \
              --output json 2>/dev/null | jq -r '.endpoint_status.state // "UNKNOWN"')"
            case "${state}" in
              ONLINE)
                echo "endpoint ${ENDPOINT} is ONLINE after ~$((attempt * 20))s"
                exit 0 ;;
              OFFLINE|FAILED)
                echo "::error::endpoint ${ENDPOINT} reported ${state} — it will not become ready"
                exit 1 ;;
              *)
                echo "  ${state} (${attempt}/60)"
                sleep 20 ;;
            esac
          done
          echo "::error::endpoint ${ENDPOINT} never reached ONLINE within 20 minutes"
          exit 1

      # Which foundation models are pre-provisioned varies BY REGION, and the index creation
      # reports a missing one as a failure of the index:
      #
      #     cannot create resources.vector_search_indexes.similar_cases:
      #     Model serving endpoint databricks-bge-large-en not found. (404)
      #
      # That is the fourth distinct error this one bundle step produced, each hiding the next,
      # and this one is not our bug at all — `databricks-bge-large-en` simply does not exist
      # in eu-central-1. Checking first turns it into a direct statement, and lists what IS
      # available so the fix does not need a trip to the console.
      - name: 4a-iii) Verify the embedding endpoint the case index needs
        env:
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          set -uo pipefail
          # Read the name from the bundle rather than repeating it here: a check that pins
          # its own copy of the value passes happily while the bundle asks for something else.
          wanted="$(python -c 'import yaml;print(yaml.safe_load(open("infra/bundles/databricks.yml"))["variables"]["embedding_endpoint_name"]["default"])')"
          if databricks serving-endpoints get "${wanted}" >/dev/null 2>&1; then
            echo "embedding endpoint '${wanted}' is present"
            exit 0
          fi
          echo "::error::embedding endpoint '${wanted}' does not exist in this workspace."
          echo "Embedding endpoints that DO exist here:"
          databricks serving-endpoints list -o json \
            | jq -r '.[] | select(.task // "" | test("embedding"; "i")) | "  - \(.name)  (\(.task))"' \
            || echo "  (could not list endpoints)"
          echo "Set embedding_endpoint_name in infra/bundles/databricks.yml to one of these."
          exit 1

      - name: 4b) infra/bundles (Databricks Asset Bundles)
        working-directory: infra/bundles
        env:
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: databricks bundle deploy -t ${{ inputs.environment }}

      # ---- The ML chain -------------------------------------------------------------------
      #
      # pipelines -> data -> features -> training -> registered model -> serving. Every link
      # was written and none were connected: `docs/DEPLOY.md` §6 carried the whole thing as
      # prose ("in Databricks: run the DLT pipeline, then ml/training"), nothing ran it, and
      # the serving endpoints therefore failed on every single deploy with "Registered model
      # 'fintelliguard.ml.fraud_scorer' does not exist".
      #
      # DAB deploys a bundle in one pass, so this ordering cannot live in a bundle. It lives
      # here because here is the only place it can.

      - name: 5) Fetch IEEE-CIS into the raw bucket
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          set -euo pipefail
          python -m pip install --quiet boto3 kaggle
          bucket="$(terraform -chdir=infra/aws output -raw raw_bucket_name)"
          python -m ml.training.ingest_ieee --bucket "${bucket}" --region "${AWS_REGION}"

      - name: 6) Run the DLT pipeline to build the gold feature tables
        env:
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        working-directory: infra/bundles
        # `bundle run` on a pipeline blocks until the update finishes, which is what we want:
        # the training job reads the table this produces, and starting it against a
        # half-built table would train on whatever happened to be committed so far.
        run: databricks bundle run -t ${{ inputs.environment }} medallion

      - name: 7) Train, gate and register the fraud scorer
        env:
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        working-directory: infra/bundles
        run: databricks bundle run -t ${{ inputs.environment }} train_fraud_scorer

      - name: 8) Serving endpoints, pinned to the version the gate promoted
        env:
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        working-directory: infra/bundles/serving
        # Resolved from the `production` ALIAS, never from "latest". This is what makes the
        # promotion gate real: a model that missed AUC-ROC >= 0.92 or fraud precision >= 0.85
        # is registered under `staging` and never takes `production`, so this lookup finds
        # the last model that DID pass — or fails outright on a first deploy where none has.
        # Serving "the newest version" would deploy exactly the model the gate rejected.
        run: |
          set -euo pipefail
          if ! version="$(databricks model-versions get-by-alias \
              fintelliguard.ml.fraud_scorer production -o json | jq -er '.version')"; then
            echo "::error::no version of fintelliguard.ml.fraud_scorer holds the 'production' alias."
            echo "The promotion gate rejected this training run and there is no previously"
            echo "promoted model to fall back to. Serving is deliberately NOT updated."
            exit 1
          fi
          echo "serving fraud_scorer version ${version} (production alias)"
          databricks bundle deploy -t ${{ inputs.environment }} \
            --var="fraud_model_version=${version}"
