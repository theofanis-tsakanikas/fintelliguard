name: Deploy

# GATED + DEFERRED: manual dispatch only. Runs the ORDERED apply sequence across layers.
# Each layer consumes the previous layer's remote-state outputs, so order matters:
#   1. infra/aws            (VPC, KMS, S3, Secrets, IAM)
#   2. infra/databricks     (workspace + Unity Catalog) — consumes infra/aws
#   3. agents/bedrock/terraform (agent, KB, guardrail, action-group Lambda) — consumes infra/aws
#   4. infra/bundles        (DABs: DLT + serving + vector search + agent + grants)
#
# This workflow used to run three consecutive `terraform apply -auto-approve` with no
# `terraform plan` anywhere, on long-lived IAM user keys, with no dependency on CI, from
# any branch. CLAUDE.md's rule is "always plan before apply; never apply without reviewing
# the plan" — the `environment:` gate approved a commit SHA, not a diff, because GitHub
# environment approval fires before the first step runs.
#
# It is now two jobs. `plan` renders every layer's diff and uploads it. `apply` requires
# the environment approval, downloads THAT plan, and applies exactly it. The approver sees
# what they are approving.
on:
  workflow_dispatch:
    inputs:
      # `prod` used to be offered here. `infra/bundles/databricks.yml` declares only a
      # `dev` target, so step 4 failed on prod AFTER three layers had already applied —
      # a partial deploy with no rollback. It is not offered until a prod target exists.
      environment:
        description: Target environment
        type: choice
        options: [dev]
        default: dev
      # DEFAULT core: the Bedrock layer owns the OpenSearch Serverless collection, which is
      # the single most expensive ALWAYS-ON resource in the estate — it bills 24/7 for as
      # long as it stands, whether or not anything queries it. Tier 2 is not wired yet
      # (mosaic_endpoint_url is empty), so paying for AOSS during Tier 1 / Tier 3 work is
      # pure waste. `full` opts back in only when we actually exercise the Bedrock agent.
      layers:
        description: "core = Tier 1/3 path, no Bedrock/AOSS (the costly always-on vector store). full = also deploy the Bedrock agent + KB for Tier 2."
        type: choice
        options: [core, full]
        default: core
      # DEFAULT auto: the trained model is registered in Unity Catalog under the `production`
      # alias and PERSISTS as long as infra/databricks stands. Retraining it on every deploy
      # re-runs the DLT medallion pipeline and a training job for a model that already exists
      # — minutes of cluster time and dollars, for the same result. `auto` skips IEEE fetch +
      # DLT + training when a production model is already present; `force` rebuilds it (use
      # after a feature/training-code change). A fresh workspace has no model, so `auto`
      # trains the first time regardless.
      retrain:
        description: "auto = skip training if a production model already exists (train once, reuse). force = always retrain."
        type: choice
        options: [auto, force]
        default: auto
      # The staged deploy: run the whole thing, or one stage on its own. `all` reproduces the
      # ORIGINAL behaviour EXACTLY — every stage predicate below is true when stage is `all`, so
      # each step keeps its old condition unchanged. The single stages let you run the cheap-to-
      # verify part (network) on its own, or re-run serving/streaming without re-applying infra.
      #
      # Dependency order is network -> train -> serving; a single stage assumes the stages
      # before it already ran (the estate exists). `streaming` is DELIBERATELY not part of `all`:
      # `all` is exactly the proven deploy, and the private streaming path is an explicit,
      # separately-run stage (prove it, record, then destroy — MSK bills while it stands).
      stage:
        description: "all = the full deploy (unchanged). network = infra only (VPC/MSK/workspace/UC + the private connection). train = data + model. serving = the endpoints + cross-cloud wiring. streaming = deploy & run the MSK probe (prove the private path); run AFTER network/all."
        type: choice
        options: [all, network, train, serving, streaming]
        default: all

permissions:
  contents: read
  id-token: write # OIDC — short-lived credentials, no stored AWS keys

# Two dispatches racing would both apply. The DynamoDB lock protects Terraform state, but
# nothing protects `databricks bundle deploy`.
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1

jobs:
  # The deployed artifact must be the validated one. Without this the workflow could apply
  # code that fails lint, the red-team gate, or gate_proof — the Responsible-AI gates were
  # enforced on PRs only, never on what actually shipped.
  validate:
    name: Re-run the gates on the deploying ref
    uses: ./.github/workflows/ci.yml

  # Plans the FOUNDATION layer only, and uploads the diff as TEXT for the approver to read.
  #
  # Two things this deliberately does not do, both learned the hard way:
  #
  # 1. It does not plan every layer. `infra/databricks` and `agents/bedrock/terraform` read
  #    `data.terraform_remote_state.aws`, so before `infra/aws` has applied those outputs do
  #    not exist and the plan fails on "Unsupported attribute". Plan-all-then-apply-all
  #    cannot work on a first deploy, or on any deploy that changes an upstream output.
  # 2. It does not upload the BINARY plan. A `.tfplan` stores every variable value verbatim,
  #    including `sensitive = true` ones — `sensitive` redacts console output, not the file.
  #    Uploading it published `DATABRICKS_CLIENT_SECRET` in cleartext to anyone with repo
  #    read, for five days, recoverable with `terraform show -json tfplan`. The text render
  #    honours `sensitive`; the file does not.
  plan:
    name: Plan the foundation layer (${{ inputs.environment }})
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: fintelliguard-plan

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false

      - name: Plan infra/aws and render it for review
        run: |
          set -euo pipefail
          terraform -chdir=infra/aws init -input=false -lockfile=readonly
          terraform -chdir=infra/aws plan -input=false -out=tfplan
          # `show` respects `sensitive`; the .tfplan file it reads does not. Only this
          # render leaves the runner.
          terraform -chdir=infra/aws show -no-color tfplan | tee infra/aws/plan.txt
          rm -f infra/aws/tfplan

      - name: Upload the plan text for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: plan-${{ inputs.environment }}-${{ github.sha }}
          path: infra/aws/plan.txt
          retention-days: 5
          if-no-files-found: error

  apply:
    name: Apply — stage ${{ inputs.stage }} (${{ inputs.environment }})
    needs: plan
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }} # the approval gate — the plan text is the artifact
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: fintelliguard-apply

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false

      - uses: databricks/setup-cli@dd60b7b133203edca3e8f08b1e053c43a979296e # v1.8.0

      # Pinned to the version the gates run on. The corpus loader further down is repo code,
      # so leaving it to whatever interpreter the runner image happens to ship would mean the
      # deploy executes a Python that CI never validated against.
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      # PER-LAYER plan -> apply, in dependency order. Each layer's plan is computed AFTER
      # the layer it depends on has applied, which is the only order that can work: layers 2
      # and 3 read layer 1's remote-state outputs, and those do not exist until layer 1 runs.
      #
      # Each `plan -out` / `apply tfplan` pair lives entirely on the runner and the plan file
      # is deleted immediately — so what applies is exactly what was just planned, and the
      # file that carries the secrets never leaves the machine. Every diff is printed here
      # for the record; the approver read layer 1's before approving this job.
      # A secret scheduled for deletion still OWNS its name, and Secrets Manager refuses to
      # create another one with it:
      #
      #     InvalidRequestException: You can't create this secret because a secret with this
      #     name is already scheduled for deletion.
      #
      # `secret_recovery_window_days = 0` in dev.auto.tfvars stops NEW teardowns from parking
      # secrets in limbo, but it cannot help an estate already torn down under the old 7-day
      # default — which is what failed run 29706126775, and only after MSK had spent 26
      # minutes creating. Without this step that deploy is blocked for a week.
      #
      # Scoped twice over, because force-deleting a secret is irreversible: only names under
      # THIS project and environment's prefix, and only ones already scheduled for deletion.
      # A live secret has no DeletedDate and is never touched.
      - name: Purge secrets left pending deletion by a previous teardown
        if: ${{ inputs.stage == 'all' || inputs.stage == 'network' }}
        env:
          PREFIX: fintelliguard/${{ inputs.environment }}/
        run: |
          set -euo pipefail
          pending="$(aws secretsmanager list-secrets --include-planned-deletion \
            --query "SecretList[?DeletedDate!=null && starts_with(Name, '${PREFIX}')].Name" \
            --output text)"
          if [ -z "${pending}" ]; then
            echo "no secrets pending deletion under ${PREFIX}"
            exit 0
          fi
          for name in ${pending}; do
            echo "purging ${name} (scheduled for deletion, blocks re-creation)"
            aws secretsmanager delete-secret --secret-id "${name}" \
              --force-delete-without-recovery >/dev/null
          done

      - name: Apply every layer, in dependency order
        if: ${{ inputs.stage == 'all' || inputs.stage == 'network' }}
        env:
          TF_VAR_databricks_account_id: ${{ secrets.DATABRICKS_ACCOUNT_ID }}
          TF_VAR_databricks_client_id: ${{ secrets.DATABRICKS_CLIENT_ID }}
          TF_VAR_databricks_client_secret: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          # `core` omits agents/bedrock/terraform (and with it AOSS). The base and workspace
          # layers are always applied; the Bedrock layer only when explicitly asked for.
          if [ "${{ inputs.layers }}" = "full" ]; then
            layers="infra/aws infra/databricks agents/bedrock/terraform"
          else
            layers="infra/aws infra/databricks"
          fi
          echo "applying layers: ${layers}"
          for dir in ${layers}; do
            echo "::group::${dir}"
            terraform -chdir="${dir}" init -input=false -lockfile=readonly
            terraform -chdir="${dir}" plan -input=false -out=tfplan
            terraform -chdir="${dir}" show -no-color tfplan
            terraform -chdir="${dir}" apply -input=false tfplan
            rm -f "${dir}/tfplan"
            echo "::endgroup::"
          done

      # A single downstream stage (train / serving / streaming) does NOT apply infra — it reads
      # the estate the network stage already built. But this is a fresh runner, so the layers
      # must be `terraform init`-ed before any `terraform output` can read their remote state.
      # Skipped for all/network, where the apply step above already initialised them.
      - name: Init the Terraform layers for output reads (single downstream stage)
        if: ${{ inputs.stage == 'train' || inputs.stage == 'serving' || inputs.stage == 'streaming' }}
        run: |
          set -euo pipefail
          for dir in infra/aws infra/databricks; do
            terraform -chdir="${dir}" init -input=false -lockfile=readonly >/dev/null
          done

      # Bedrock creates the Knowledge Base, the bucket and the data source — and leaves all
      # three EMPTY. Terraform has no resource for "the documents", so without this step a
      # deploy finishes with the KB `ACTIVE` and zero objects in it, which is precisely what
      # a post-deploy health check found. Tier 2 grounds every verdict in retrieved
      # regulatory text; there was none to retrieve.
      #
      # `docs/DEPLOY.md` used to carry this as a manual `aws s3 cp ... --recursive`, against
      # CLAUDE.md's "IaC only. No console deployments, ever." Worse, that command bypasses
      # `screen_document()` entirely, while `docs/governance/AI_ACT_ANNEX_IV.md` states as
      # regulated fact that the corpus IS screened at ingestion. The module below is the only
      # loader now, and it uploads the SCREENED text rather than the files on disk — a screen
      # you can walk around by using a different upload command is not a control.
      #
      # Ids come from the layer that owns them, never pasted.
      - name: Load the regulatory corpus into the Knowledge Base (screened)
        # Only `full` deploys the Bedrock layer; in `core` there is no KB to load, and the
        # `terraform output` reads below would fail on outputs that were never created. Part of
        # the network stage — it loads the Tier-2 infra's corpus right after that layer applies.
        if: ${{ inputs.layers == 'full' && (inputs.stage == 'all' || inputs.stage == 'network') }}
        run: |
          set -euo pipefail
          cd agents/bedrock/terraform
          bucket="$(terraform output -raw kb_docs_bucket)"
          kb="$(terraform output -raw knowledge_base_id)"
          ds="$(terraform output -raw data_source_id)"
          cd "$GITHUB_WORKSPACE"
          python -m pip install --quiet boto3
          python -m agents.bedrock.kb.ingest \
            --bucket "${bucket}" --knowledge-base-id "${kb}" --data-source-id "${ds}" \
            --region "${AWS_REGION}"

      # The workspace host cannot be a hand-pasted secret: the workspace does not exist
      # until layer 2 applies, and its URL is assigned by Databricks at creation. Pasting it
      # meant the first deploy could only ever fail, and every later one silently trusted a
      # value nothing kept in sync with the workspace actually deployed. Read it from the
      # layer that creates it.
      - name: Resolve the workspace host from layer 2's output
        # Every Databricks stage needs the host; only pure `network` does not. Init for the
        # single downstream stages was done above; for all/network the apply step did it.
        if: ${{ inputs.stage != 'network' }}
        run: |
          set -euo pipefail
          host="$(terraform -chdir=infra/databricks output -raw workspace_url)"
          case "${host}" in https://*) ;; *) host="https://${host}" ;; esac
          echo "DATABRICKS_HOST=${host}" >> "$GITHUB_ENV"
          echo "workspace host: ${host}"

      # Whether the ML chain (steps 5-7) needs to run at all. Re-fetching IEEE-CIS, re-running
      # the DLT medallion and re-training rebuilds a model at real cluster cost — pointless if
      # the model already promoted was built from the SAME code. The decision is by content
      # fingerprint, not mere existence: `reuse_decision` compares the fingerprint of the code
      # being deployed (feature defs + training code) against the tag on the production
      # version. Identical -> skip; changed, absent, untagged or any registry error -> train.
      # That last part matters — a feature change with `auto` retrains automatically, so
      # serving never pairs new features with an old model. `force` retrains unconditionally.
      - name: Decide whether the fraud scorer needs (re)training
        id: traincheck
        if: ${{ inputs.stage == 'all' || inputs.stage == 'train' }}
        env:
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.retrain }}" = "force" ]; then
            echo "retrain=force — training will run."
            echo "train=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # FULL mlflow, deliberately. `MlflowClient.get_model_version_by_alias(...).tags` is how
          # the reuse check reads the content fingerprint off the promoted model — and the
          # slimmed "skinny" mlflow build returns the version with EMPTY tags, so the check saw
          # no fingerprint, failed closed, and RETRAINED on every deploy (run 29888162885
          # retrained a model whose fingerprint already matched — real cluster cost for nothing).
          # Full mlflow returns the tags; databricks-sdk carries the OAuth M2M auth for UC.
          python -m pip install --quiet "mlflow==2.16.2" databricks-sdk
          # Exit 0 => a model with this code's fingerprint already holds production (skip);
          # non-zero => train. `if` consumes the exit code without tripping `set -e`.
          if python -m ml.training.reuse_decision fintelliguard.ml.fraud_scorer production; then
            echo "train=false" >> "$GITHUB_OUTPUT"
          else
            echo "train=true" >> "$GITHUB_OUTPUT"
          fi

      # Authenticates as the SERVICE PRINCIPAL (OAuth M2M), not a PAT. The principal already
      # exists — the Terraform layers above run as it. A PAT would be a second, longer-lived
      # credential for the same identity, minted by hand, rotated by nobody.
      # 4a) The prerequisite the main bundle cannot express.
      #
      # `resources/vector_search.yml` builds a DELTA_SYNC index over `gold.resolved_cases`,
      # and Databricks refuses to create an index whose source table does not exist. DAB
      # deploys everything in one pass with no way to say "run this job, then build that
      # index", so the ordering lives here: seed the table, THEN deploy the bundle that
      # indexes it.
      - name: 4a) Seed gold.resolved_cases (prerequisite for the case index)
        if: ${{ inputs.stage == 'all' || inputs.stage == 'train' }}
        working-directory: infra/bundles/prereq
        env:
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          databricks bundle deploy -t ${{ inputs.environment }}
          databricks bundle run -t ${{ inputs.environment }} seed_resolved_cases

      # Creating the endpoint is not the same as having one. `bundle deploy` returns as soon
      # as Databricks accepts the request, and a Vector Search endpoint then spends minutes
      # PROVISIONING — during which the main bundle's index creation fails with
      #
      #     NOT_FOUND: AI Search endpoint fintelliguard-cases not found.
      #
      # which reads like a naming or permissions problem and is neither. Polling for ONLINE
      # is the ordering DAB cannot express, in the only place that can express it.
      - name: 4a-ii) Wait for the Vector Search endpoint to be ONLINE
        if: ${{ inputs.stage == 'all' || inputs.stage == 'train' }}
        env:
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          ENDPOINT: fintelliguard-cases
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            state="$(databricks vector-search-endpoints get-endpoint "${ENDPOINT}" \
              --output json 2>/dev/null | jq -r '.endpoint_status.state // "UNKNOWN"')"
            case "${state}" in
              ONLINE)
                echo "endpoint ${ENDPOINT} is ONLINE after ~$((attempt * 20))s"
                exit 0 ;;
              OFFLINE|FAILED)
                echo "::error::endpoint ${ENDPOINT} reported ${state} — it will not become ready"
                exit 1 ;;
              *)
                echo "  ${state} (${attempt}/60)"
                sleep 20 ;;
            esac
          done
          echo "::error::endpoint ${ENDPOINT} never reached ONLINE within 20 minutes"
          exit 1

      # Which foundation models are pre-provisioned varies BY REGION, and the index creation
      # reports a missing one as a failure of the index:
      #
      #     cannot create resources.vector_search_indexes.similar_cases:
      #     Model serving endpoint databricks-bge-large-en not found. (404)
      #
      # That is the fourth distinct error this one bundle step produced, each hiding the next,
      # and this one is not our bug at all — `databricks-bge-large-en` simply does not exist
      # in eu-central-1. Checking first turns it into a direct statement, and lists what IS
      # available so the fix does not need a trip to the console.
      - name: 4a-iii) Verify the embedding endpoint the case index needs
        if: ${{ inputs.stage == 'all' || inputs.stage == 'train' }}
        env:
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          set -uo pipefail
          # The apply job installs no repo dependencies — step 5 is the first thing that pips
          # anything — so this needs its own parser. `ModuleNotFoundError: No module named
          # 'yaml'` is what the first version of this step produced, which the repo's own
          # dependency gate cannot catch: it checks modules under version control, and an
          # inline workflow script is not one.
          python -m pip install --quiet pyyaml
          # Read the name from the bundle rather than repeating it here: a check that pins
          # its own copy of the value passes happily while the bundle asks for something else.
          wanted="$(python -c 'import yaml;print(yaml.safe_load(open("infra/bundles/databricks.yml"))["variables"]["embedding_endpoint_name"]["default"])')"
          if databricks serving-endpoints get "${wanted}" >/dev/null 2>&1; then
            echo "embedding endpoint '${wanted}' is present"
            exit 0
          fi
          echo "::error::embedding endpoint '${wanted}' does not exist in this workspace."
          echo "Embedding endpoints that DO exist here:"
          databricks serving-endpoints list -o json \
            | jq -r '.[] | select(.task // "" | test("embedding"; "i")) | "  - \(.name)  (\(.task))"' \
            || echo "  (could not list endpoints)"
          echo "Set embedding_endpoint_name in infra/bundles/databricks.yml to one of these."
          exit 1

      - name: 4b) infra/bundles (Databricks Asset Bundles)
        if: ${{ inputs.stage == 'all' || inputs.stage == 'train' }}
        working-directory: infra/bundles
        env:
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        # raw_bucket is resolved from the layer that owns it, never pasted: the bucket name
        # carries an account-id suffix, and the DLT Auto Loader reads IEEE-CIS from it. Without
        # this the pipeline's schema inference fails on a non-existent path.
        run: |
          set -euo pipefail
          # `databricks bundle deploy` builds the wheel artifact via `python -m build`; the
          # apply runner installs no repo deps, so `build` must be put on it first.
          python -m pip install --quiet build
          raw_bucket="$(terraform -chdir=../../infra/aws output -raw raw_bucket_name)"
          databricks bundle deploy -t ${{ inputs.environment }} \
            --var="raw_bucket=${raw_bucket}"

      # ---- The ML chain -------------------------------------------------------------------
      #
      # pipelines -> data -> features -> training -> registered model -> serving. Every link
      # was written and none were connected: `docs/DEPLOY.md` §6 carried the whole thing as
      # prose ("in Databricks: run the DLT pipeline, then ml/training"), nothing ran it, and
      # the serving endpoints therefore failed on every single deploy with "Registered model
      # 'fintelliguard.ml.fraud_scorer' does not exist".
      #
      # DAB deploys a bundle in one pass, so this ordering cannot live in a bundle. It lives
      # here because here is the only place it can.

      # The OIDC role session is one hour (max_session_duration = 3600 in bootstrap/oidc.tf),
      # and by this point the deploy has spent longer than that: MSK alone takes ~26 minutes
      # to create, then the workspace, the corpus load, the seed job's cluster, and the
      # bundle. The credentials assumed at job start have expired, and the next AWS call dies:
      #
      #     ExpiredToken: The security token included in the request is expired
      #
      # This was invisible until a run first got PAST step 4b — every earlier deploy failed
      # before the clock ran out. Re-assuming the role mints a fresh one-hour session for the
      # remaining AWS work (only step 5 touches AWS; 6-8 are Databricks). Refreshing is
      # deliberately preferred over raising max_session_duration: it keeps the credential
      # short-lived, and the >1h runtime is itself the signal that this monolith should
      # eventually split into infra / data+ml workflows.
      - name: Refresh AWS credentials (the OIDC session is 1h; this deploy runs longer)
        # Only step 5 (IEEE fetch) touches AWS after this point; if training is skipped there
        # is nothing left that needs fresh AWS creds, so don't assume the role for nothing.
        if: steps.traincheck.outputs.train == 'true'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: fintelliguard-apply-ml

      - name: 5) Fetch IEEE-CIS into the raw bucket
        if: steps.traincheck.outputs.train == 'true'
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          set -euo pipefail
          python -m pip install --quiet boto3 kaggle
          bucket="$(terraform -chdir=infra/aws output -raw raw_bucket_name)"
          python -m ml.training.ingest_ieee --bucket "${bucket}" --region "${AWS_REGION}"

      - name: 6) Run the DLT pipeline to build the gold feature tables
        if: steps.traincheck.outputs.train == 'true'
        env:
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        working-directory: infra/bundles
        # `bundle run` on a pipeline blocks until the update finishes, which is what we want:
        # the training job reads the table this produces, and starting it against a
        # half-built table would train on whatever happened to be committed so far.
        run: databricks bundle run -t ${{ inputs.environment }} medallion

      - name: 7) Train, gate and register the fraud scorer
        if: steps.traincheck.outputs.train == 'true'
        env:
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        working-directory: infra/bundles
        run: databricks bundle run -t ${{ inputs.environment }} train_fraud_scorer

      - name: 8) Serving endpoints, pinned to the version the gate promoted
        if: ${{ inputs.stage == 'all' || inputs.stage == 'serving' }}
        env:
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        working-directory: infra/bundles/serving
        # Resolved from the `production` ALIAS, never from "latest". This is what makes the
        # promotion gate real: a model that missed AUC-ROC >= 0.92 or fraud precision >= 0.85
        # is registered under `staging` and never takes `production`, so this lookup finds
        # the last model that DID pass — or fails outright on a first deploy where none has.
        # Serving "the newest version" would deploy exactly the model the gate rejected.
        run: |
          set -euo pipefail
          if ! version="$(databricks model-versions get-by-alias \
              fintelliguard.ml.fraud_scorer production -o json | jq -er '.version')"; then
            echo "::error::no version of fintelliguard.ml.fraud_scorer holds the 'production' alias."
            echo "The promotion gate rejected this training run and there is no previously"
            echo "promoted model to fall back to. Serving is deliberately NOT updated."
            exit 1
          fi
          echo "serving fraud_scorer version ${version} (production alias)"
          databricks bundle deploy -t ${{ inputs.environment }} \
            --var="fraud_model_version=${version}"

      # Refresh AWS creds before the cross-cloud wiring: for `full` it runs terraform apply
      # (AWS) and a Secrets Manager write AFTER the long ML stretch, so the session assumed at
      # job start (or before step 5) may have expired. Gated on `full`, not on training, so it
      # always precedes step 9 in a full deploy.
      - name: Refresh AWS credentials before the cross-cloud wiring
        if: ${{ inputs.layers == 'full' && (inputs.stage == 'all' || inputs.stage == 'serving') }}
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: fintelliguard-apply-xcloud

      # 9) Wire the Tier-2 cross-cloud contract now that BOTH sides exist: the Mosaic serving
      # endpoint (step 8) and the Bedrock action-group Lambda (applied in the layers loop with
      # an empty MOSAIC_ENDPOINT_URL because the endpoint did not exist yet). Resolve the
      # endpoint's invocations URL and set it, and populate the Databricks-token secret with the
      # service principal's OAuth credentials the Lambda exchanges for a workspace token. Only
      # `full` deploys the Bedrock layer, so this is scoped to it.
      - name: 9) Wire the Tier-2 cross-cloud contract (Bedrock -> Mosaic)
        if: ${{ inputs.layers == 'full' && (inputs.stage == 'all' || inputs.stage == 'serving') }}
        env:
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          # The served endpoint's name carries a bundle-target prefix; resolve it rather than
          # hardcode the prefix, then build the invocations URL from the workspace host.
          ep="$(databricks serving-endpoints list -o json \
            | jq -r '.[].name | select(endswith("fintelliguard-fraud-score"))' | head -1)"
          if [ -z "${ep}" ]; then
            echo "::error::could not find the fraud-score serving endpoint to wire into Bedrock"
            exit 1
          fi
          url="${DATABRICKS_HOST}/serving-endpoints/${ep}/invocations"
          echo "wiring Bedrock action group to serving endpoint ${ep}"

          # Populate the Databricks-token secret with the SP's OAuth credentials (client
          # id/secret + token endpoint). Written from a umask-restricted temp file, never argv,
          # and removed immediately. Secret name follows infra/aws's project/environment/name.
          umask 077
          creds_file="$(mktemp)"
          jq -n \
            --arg cid "${DATABRICKS_CLIENT_ID}" \
            --arg csec "${DATABRICKS_CLIENT_SECRET}" \
            --arg te "${DATABRICKS_HOST}/oidc/v1/token" \
            '{client_id:$cid, client_secret:$csec, token_endpoint:$te}' > "${creds_file}"
          aws secretsmanager put-secret-value \
            --secret-id "fintelliguard/${{ inputs.environment }}/databricks/token" \
            --secret-string "file://${creds_file}" >/dev/null
          rm -f "${creds_file}"
          echo "databricks/token secret populated with the SP OAuth credentials"

          # Re-apply the Bedrock layer with the resolved URL. No config changed since it applied
          # in the loop, so the only diff is the Lambda's MOSAIC_ENDPOINT_URL env var. Same
          # plan -> apply-the-saved-plan shape as the layer loop: the diff is printed for the
          # record and exactly it is applied.
          terraform -chdir=agents/bedrock/terraform init -input=false >/dev/null
          terraform -chdir=agents/bedrock/terraform plan -input=false -out=tfplan \
            -var="mosaic_endpoint_url=${url}"
          terraform -chdir=agents/bedrock/terraform show -no-color tfplan
          terraform -chdir=agents/bedrock/terraform apply -input=false tfplan
          rm -f agents/bedrock/terraform/tfplan

      # 10) Tier 3 — register the analyst copilot and serve it. BEST-EFFORT (continue-on-error):
      # the Agent-Framework serving path is newer and must never block or roll back the proven
      # fraud endpoint, so a failure here is logged and the deploy still succeeds. Runs for core
      # and full alike — the copilot is Databricks-side, independent of the Bedrock layer. The
      # fraud endpoint exists by now (step 8), so its name resolves; the LLM + vector index are
      # already present. Demo transactions come from the repo (parity-tested against the Tier-2
      # store), so no AWS creds are needed here.
      - name: 10) Register and serve the Tier-3 copilot (best-effort)
        if: ${{ inputs.stage == 'all' || inputs.stage == 'serving' }}
        continue-on-error: true
        env:
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          set -uo pipefail
          python -m pip install --quiet "mlflow==2.16.2" pandas databricks-sdk
          fraud_ep="$(databricks serving-endpoints list -o json \
            | jq -r '.[].name | select(endswith("fintelliguard-fraud-score"))' | head -1)"
          if [ -z "${fraud_ep}" ]; then
            echo "fraud endpoint not found; skipping copilot registration (best-effort)"
            exit 0
          fi
          echo "copilot get_fraud_score -> ${fraud_ep}"
          PYTHONPATH=. python infra/bundles/register_copilot.py \
            --model-name fintelliguard.ml.copilot_agent \
            --fraud-endpoint "${fraud_ep}" \
            --llm-endpoint databricks-claude-haiku-4-5 \
            --vector-endpoint fintelliguard-cases \
            --vector-index fintelliguard.gold.case_embeddings_index \
            --features-file agents/databricks/demo_transactions.json \
            || { echo "copilot registration failed (best-effort)"; exit 0; }
          agver="$(databricks model-versions get-by-alias \
            fintelliguard.ml.copilot_agent production -o json | jq -er '.version')" \
            || { echo "no copilot production alias (best-effort)"; exit 0; }
          echo "serving copilot version ${agver}"
          ( cd infra/bundles/copilot \
            && databricks bundle deploy -t ${{ inputs.environment }} \
                 --var="agent_model_version=${agver}" ) \
            || echo "copilot serving deploy failed (best-effort)"

      # 11) Smoke-test the Tier-2 agent end to end (grounded verdict). BEST-EFFORT: foundation-
      # model access is account/region config, not our code, so an inconclusive invocation must
      # not fail the deploy — the cross-cloud contract is gated by the Lambda tests + a live
      # Lambda invocation. Only `full` deploys the Bedrock agent.
      - name: 11) Smoke-test the Tier-2 agent (best-effort)
        if: ${{ inputs.layers == 'full' && (inputs.stage == 'all' || inputs.stage == 'serving') }}
        continue-on-error: true
        run: |
          set -uo pipefail
          python -m pip install --quiet boto3
          python agents/bedrock/smoke_agent.py --region "${AWS_REGION}"

      # ---- Stage: streaming — the private MSK ↔ Databricks path -----------------------------
      #
      # DELIBERATELY not part of `all`: `all` is the proven deploy, and MSK bills per broker-hour
      # while it stands. Run this stage on its own AFTER network/all, prove the private path,
      # record, then destroy. It assumes the network stage already applied (MSK, the SG opening,
      # the instance profile, the ECR repo all exist). enable_msk is already true in dev, so the
      # network apply stood MSK up; here we only build the producer image and PROVE the path.

      # The Fargate generator (the in-VPC payment-gateway stand-in) runs THIS image. Pushed to the
      # ECR repo the network stage created; the task definition references :latest.
      - name: streaming) Build & push the in-VPC generator image
        if: ${{ inputs.stage == 'streaming' }}
        run: |
          set -euo pipefail
          repo="$(terraform -chdir=infra/aws output -raw generator_ecr_repository_url)"
          if [ -z "${repo}" ] || [ "${repo}" = "null" ]; then
            echo "::error::no generator ECR repo — run the network stage first (enable_msk=true)"
            exit 1
          fi
          registry="${repo%%/*}"
          aws ecr get-login-password --region "${AWS_REGION}" \
            | docker login --username AWS --password-stdin "${registry}"
          docker build -f deploy/streaming/Dockerfile -t "${repo}:latest" .
          docker push "${repo}:latest"

      # The proof: deploy ONLY the isolated streaming bundle (the probe job) and run it. It does a
      # full Kafka round-trip from a classic cluster carrying the MSK instance profile, and exits
      # non-zero — failing THIS step, loudly, with the reason — if the private path is down. Its
      # inputs come from the layers that own them, never pasted.
      - name: streaming) Deploy & run the MSK connectivity probe (proves the private path)
        if: ${{ inputs.stage == 'streaming' }}
        working-directory: infra/bundles/streaming
        env:
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          boot="$(terraform -chdir=../../../infra/aws output -raw msk_bootstrap_brokers_sasl_iam)"
          ip_arn="$(terraform -chdir=../../../infra/aws output -raw msk_access_instance_profile_arn)"
          if [ -z "${boot}" ] || [ "${boot}" = "null" ]; then
            echo "::error::MSK has no bootstrap brokers — run the network stage first (enable_msk=true)"
            exit 1
          fi
          # Pass the vars as BUNDLE_VAR_* env, NOT --var: the MSK bootstrap string is a
          # COMMA-separated list of brokers (b-1...:9098,b-2...:9098), and `databricks bundle
          # --var` splits its value on commas as multiple assignments — so the second broker
          # was read as a bare variable name ("unexpected flag value for variable assignment").
          # The env form takes the whole value verbatim.
          export BUNDLE_VAR_kafka_bootstrap="${boot}"
          export BUNDLE_VAR_msk_instance_profile_arn="${ip_arn}"
          databricks bundle deploy -t ${{ inputs.environment }}
          databricks bundle run -t ${{ inputs.environment }} msk_probe

      # With the private path proven, start the live funnel: the generator produces transactions
      # to MSK and the scorer consumes and scores them (Tier 1) inside the VPC. Both are detached
      # one-shot tasks — nothing is left as a standing service; `destroy` stops them (see
      # destroy.yml's generator-stop step) and they are visible in CloudWatch meanwhile.
      - name: streaming) Start the in-VPC generator + scorer (live funnel)
        if: ${{ inputs.stage == 'streaming' }}
        run: |
          set -euo pipefail
          cluster="$(terraform -chdir=infra/aws output -raw generator_ecs_cluster)"
          subnets="$(terraform -chdir=infra/aws output -json private_subnet_ids | jq -r 'join(",")')"
          sg="$(terraform -chdir=infra/aws output -raw generator_security_group_id)"
          net="awsvpcConfiguration={subnets=[${subnets}],securityGroups=[${sg}],assignPublicIp=DISABLED}"
          for family in generator scorer; do
            task="$(terraform -chdir=infra/aws output -raw ${family}_task_family)"
            echo "starting ${task}"
            aws ecs run-task --cluster "${cluster}" --launch-type FARGATE \
              --task-definition "${task}" --network-configuration "${net}" \
              --count 1 --query 'tasks[0].taskArn' --output text
          done
          echo "live funnel started — logs: /ecs/$(terraform -chdir=infra/aws output -raw generator_ecs_cluster | sed 's/-streaming//')-generator"
