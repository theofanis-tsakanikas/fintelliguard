name: Bootstrap RE-apply (state backend + OIDC trust)

# This workflow CANNOT perform the first bootstrap, and it never could.
#
# It assumes `secrets.AWS_DEPLOY_ROLE_ARN` in order to run `infra/aws/bootstrap` — the layer
# whose whole purpose is to CREATE that role. Before the first apply the role does not
# exist, the secret has no value, and AssumeRole fails. Its previous name and its comment
# ("creates the state backend", "credentials come from GitHub secrets" while it in fact uses
# OIDC) described something it is structurally incapable of doing.
#
# The first bootstrap is a HUMAN, LOCAL, one-time operation with admin credentials — the
# trust anchor cannot be derived from the trust it anchors:
#
#     cd infra/aws/bootstrap && terraform init && terraform apply
#
# That single command creates the OIDC provider, the deploy role, the state backend, AND
# writes AWS_DEPLOY_ROLE_ARN into this repository (see github_secret.tf), so nothing is
# copied by hand.
#
# What this workflow IS good for: RE-applying the layer once the role exists — widening
# `deploy_branches`, adding an environment to the OIDC `sub` allowlist, rotating the
# backend's lifecycle rules — with review and an audit trail instead of someone's laptop.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "bootstrap" to confirm RE-applying (first bootstrap must be run locally)'
        required: true

permissions:
  contents: read
  id-token: write # OIDC

jobs:
  bootstrap:
    name: Apply infra/aws/bootstrap
    runs-on: ubuntu-latest
    environment: bootstrap # GitHub environment protection (required reviewers)
    steps:
      - name: Confirmation guard
        run: |
          if [ "${{ inputs.confirm }}" != "bootstrap" ]; then
            echo "::error::type 'bootstrap' to confirm"; exit 1
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-region: eu-central-1
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: fintelliguard-bootstrap

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false

      - name: Terraform apply (bootstrap)
        working-directory: infra/aws/bootstrap
        run: |
          terraform init -input=false
          terraform plan -input=false
          terraform apply -auto-approve -input=false
