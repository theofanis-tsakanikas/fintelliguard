name: Bootstrap (state backend)

# GATED + DEFERRED: manual dispatch only. Creates the Terraform remote-state backend
# (infra/aws/bootstrap). AWS credentials come from GitHub secrets. Never auto-triggered.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "bootstrap" to confirm creating the state backend'
        required: true

permissions:
  contents: read

jobs:
  bootstrap:
    name: Apply infra/aws/bootstrap
    runs-on: ubuntu-latest
    environment: bootstrap # GitHub environment protection (required reviewers)
    steps:
      - name: Confirmation guard
        run: |
          if [ "${{ inputs.confirm }}" != "bootstrap" ]; then
            echo "::error::type 'bootstrap' to confirm"; exit 1
          fi

      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: eu-central-1
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform apply (bootstrap)
        working-directory: infra/aws/bootstrap
        run: |
          terraform init -input=false
          terraform plan -input=false
          terraform apply -auto-approve -input=false
