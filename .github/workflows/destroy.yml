name: Destroy (guarded)

# GATED + DEFERRED: manual dispatch only, with a TYPED confirmation. You must type the
# exact environment name to proceed. Tears down in REVERSE order; the state backend
# (infra/aws/bootstrap) is intentionally NOT destroyed here.
on:
  workflow_dispatch:
    inputs:
      # `prod` is not offered: `infra/bundles/databricks.yml` declares only a `dev`
      # target, so step 1 (`bundle destroy -t prod`) fails immediately and leaves every
      # layer standing — a destroy that reports failure having destroyed nothing.
      environment:
        description: Environment to destroy
        type: choice
        options: [dev]
        required: true
      confirm:
        description: Type the EXACT environment name to confirm destruction
        required: true

permissions:
  contents: read
  id-token: write # OIDC — no long-lived AWS keys for the most destructive workflow here

concurrency:
  group: destroy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  destroy:
    name: Destroy all layers (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      AWS_REGION: eu-central-1
      # No DATABRICKS_HOST / DATABRICKS_TOKEN here: the host is resolved from the layer that
      # creates the workspace (below), and auth is the service principal's OAuth. A job-level
      # value would also shadow the resolved one ambiguously.
      TF_VAR_databricks_account_id: ${{ secrets.DATABRICKS_ACCOUNT_ID }}
      TF_VAR_databricks_client_id: ${{ secrets.DATABRICKS_CLIENT_ID }}
      TF_VAR_databricks_client_secret: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    steps:
      - name: Typed-confirmation guard
        id: guard
        run: |
          if [ "${{ inputs.confirm }}" != "${{ inputs.environment }}" ]; then
            echo "::error::confirmation '${{ inputs.confirm }}' does not match environment '${{ inputs.environment }}'"
            exit 1
          fi
          echo "Confirmed destruction of '${{ inputs.environment }}'."

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Configure AWS credentials (OIDC)
        id: creds
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-region: eu-central-1
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: fintelliguard-destroy

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false

      - uses: databricks/setup-cli@dd60b7b133203edca3e8f08b1e053c43a979296e # v1.8.0

      # Read the host BEFORE anything is torn down — step 3 destroys the layer that owns
      # this output, so resolving it later would read state that no longer describes a
      # workspace. Same reason as in deploy.yml: the URL is assigned at creation, so it can
      # never be a hand-pasted secret.
      - name: Resolve the workspace host from infra/databricks (before teardown)
        run: |
          set -euo pipefail
          terraform -chdir=infra/databricks init -input=false
          host="$(terraform -chdir=infra/databricks output -raw workspace_url)"
          case "${host}" in https://*) ;; *) host="https://${host}" ;; esac
          echo "DATABRICKS_HOST=${host}" >> "$GITHUB_ENV"

      # ---- Teardown, in reverse dependency order ------------------------------------------
      #
      # Every layer step below carries the SAME condition, and it is the whole point:
      #
      #     always() && guard == success && creds == success
      #
      # A teardown must not stop at its first failure. It used to: the steps ran with the
      # default `if: success()`, so when layer 3 failed on two non-empty versioned buckets,
      # step 4 never ran and left the ENTIRE `infra/aws` layer — MSK, VPC, NAT gateway —
      # running and billing. The layer that costs the most per hour was the one protected by
      # the least. A destroy that reports failure having destroyed nothing is a bug; a
      # destroy that reports failure having destroyed everything it could is correct.
      #
      # `always()` is scoped, NOT blanket. It is conjoined with the guard and credential
      # outcomes so a mistyped confirmation or a failed OIDC assumption still aborts before
      # anything is touched — `if: always()` alone would run the teardown even when the
      # typed-confirmation guard REJECTED the request, which is the opposite of a guard.
      #
      # The job's exit status is decided at the end, by the summary step.
      - name: 1) infra/bundles
        id: bundles
        if: always() && steps.guard.outcome == 'success' && steps.creds.outcome == 'success'
        working-directory: infra/bundles
        env:
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: databricks bundle destroy -t ${{ inputs.environment }} --auto-approve

      - name: 2) agents/bedrock/terraform
        id: bedrock
        if: always() && steps.guard.outcome == 'success' && steps.creds.outcome == 'success'
        working-directory: agents/bedrock/terraform
        run: |
          terraform init -input=false
          terraform destroy -auto-approve -input=false

      # A versioned bucket cannot be deleted while any object version or delete marker
      # remains, and `force_destroy` does NOT rescue this on a teardown: `terraform destroy`
      # builds its plan from PRIOR STATE and never applies attribute changes, so the
      # provider's delete reads the `force_destroy` recorded in state — not the value in
      # config. Flipping `var.bucket_force_destroy` to true therefore fixes the NEXT
      # build-then-destroy cycle (deploy writes it into state) and does nothing for an estate
      # already recorded with false. Runs 29686453021 and 29686711080 both failed here, the
      # second one AFTER the variable was introduced, which is what proved the mechanism.
      #
      # So the teardown does not depend on the flag at all. Emptying the buckets explicitly
      # is deterministic, needs no state surgery, and works whichever value state happens to
      # hold. Bucket names come from the state Terraform is about to destroy — never
      # hardcoded, never pattern-matched against the account, so this can only ever touch
      # buckets this layer owns.
      - name: 3a) Empty the versioned buckets this layer owns
        if: always() && steps.guard.outcome == 'success' && steps.creds.outcome == 'success'
        working-directory: infra/databricks
        run: |
          set -uo pipefail
          terraform init -input=false
          for addr in $(terraform state list 2>/dev/null | grep -E '^aws_s3_bucket\.' || true); do
            name="$(terraform state show -no-color "${addr}" \
              | awk -F'"' '/^[[:space:]]+bucket[[:space:]]+=/ {print $2; exit}')"
            [ -z "${name}" ] && continue
            echo "emptying ${addr} -> ${name}"
            # Paginated: list-object-versions caps at 1000 keys, so one pass silently leaves
            # the rest behind on any bucket that outgrew that — and the delete then fails for
            # a reason the log would attribute to permissions.
            while :; do
              raw="$(aws s3api list-object-versions --bucket "${name}" --max-keys 1000 \
                --output json 2>/dev/null || echo '{}')"
              # BOTH lists matter. `Versions` alone leaves the DELETE MARKERS behind, and a
              # bucket holding only delete markers is still not empty as far as S3 is
              # concerned — the delete would keep failing with BucketNotEmpty on a bucket
              # that looks empty to `aws s3 ls`.
              objects="$(echo "${raw}" \
                | jq -c '[(.Versions // [])[], (.DeleteMarkers // [])[] | {Key, VersionId}]')"
              count="$(echo "${objects}" | jq 'length')"
              [ "${count}" = "0" ] && break
              jq -n --argjson o "${objects}" '{Objects: $o, Quiet: true}' > /tmp/del.json
              aws s3api delete-objects --bucket "${name}" --delete file:///tmp/del.json >/dev/null
              echo "  deleted ${count} version(s)/marker(s)"
            done
          done
          echo "buckets emptied."

      - name: 3) infra/databricks
        id: databricks
        if: always() && steps.guard.outcome == 'success' && steps.creds.outcome == 'success'
        working-directory: infra/databricks
        run: |
          terraform init -input=false
          terraform destroy -auto-approve -input=false

      - name: 4) infra/aws
        id: aws
        if: always() && steps.guard.outcome == 'success' && steps.creds.outcome == 'success'
        working-directory: infra/aws
        run: |
          terraform init -input=false
          terraform destroy -auto-approve -input=false

      # Continuing past a failure must never be mistaken for succeeding through it. This
      # reports every layer's outcome and fails the job if ANY layer did not come down, so a
      # partial teardown is loud, and re-dispatching is safe because destroy is idempotent.
      - name: Teardown summary (fails if any layer survived)
        if: always() && steps.guard.outcome == 'success' && steps.creds.outcome == 'success'
        env:
          OUTCOMES: |
            1) infra/bundles=${{ steps.bundles.outcome }}
            2) agents/bedrock/terraform=${{ steps.bedrock.outcome }}
            3) infra/databricks=${{ steps.databricks.outcome }}
            4) infra/aws=${{ steps.aws.outcome }}
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r line; do
            [ -z "${line}" ] && continue
            layer="${line%=*}"; outcome="${line##*=}"
            if [ "${outcome}" = "success" ]; then
              echo "  ok      ${layer}"
            else
              echo "  FAILED  ${layer} (${outcome})"
              failed=1
            fi
          done <<< "${OUTCOMES}"
          if [ "${failed}" -ne 0 ]; then
            echo "::error::at least one layer survived the teardown — resources may still be billing"
            exit 1
          fi
          echo "every layer destroyed."
