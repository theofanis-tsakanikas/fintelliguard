name: CI

# PR validation — reproduces every local gate. Needs NO cloud credentials.
on:
  pull_request:
  push:
    branches: [main]
  # Callable from `deploy.yml`, so the ref being deployed is the ref that was validated.
  # Deploy used to have no dependency on CI at all and could dispatch from any branch.
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (lint, tests, terraform, bundle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so gitleaks can scan every commit

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java (PySpark)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install OpenMP runtime (XGBoost)
        run: sudo apt-get update && sudo apt-get install -y libgomp1 libomp-dev

      - name: Install Python dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint + format check
        run: |
          ruff check .
          ruff format --check .

      - name: Pytest (full suite)
        run: pytest -q

      - name: Responsible-AI gates (guardrail red-team · verdict eval · docs in sync)
        run: |
          set -euo pipefail
          python -m agents.bedrock.guardrails.evaluate
          python -m ml.governance.generate --check

      # The gates above are green. So were the four tests that guarded the guardrail while
      # it was never attached to the agent. This step plants that bug — and eight others —
      # and fails unless the real gate refuses each one for the right reason.
      - name: Gate proof (attack our own gates)
        run: python -m scripts.gate_proof

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform fmt check (all layers)
        run: terraform fmt -check -recursive

      # `pyproject.toml` excludes `infra/` from ruff, so until now the only thing checking
      # any Terraform was `fmt`. Every one of AllowFromPublic=true, `aoss:*`, and the
      # missing bucket versioning is a stock checkov finding — a scanner would have flagged
      # all three on the day they were written.
      - name: IaC security scan (checkov)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          quiet: true
          output_format: cli
          # Documented, reviewed deviations live here rather than as inline skips, so a
          # suppression has an owner and a reason.
          config_file: .checkov.yml

      - name: Terraform validate (per layer, offline)
        run: |
          set -euo pipefail
          for dir in infra/aws infra/aws/bootstrap infra/databricks agents/bedrock/terraform; do
            echo "== validate ${dir} =="
            terraform -chdir="${dir}" init -backend=false -input=false >/dev/null
            terraform -chdir="${dir}" validate
          done

      - name: Set up Databricks CLI
        # SHA-pinned. `@main` is a branch ref, re-resolved on every run — a live
        # supply-chain path into a workflow that (in deploy.yml) holds cloud credentials.
        uses: databricks/setup-cli@dd60b7b133203edca3e8f08b1e053c43a979296e # v1.8.0

      - name: Databricks bundle schema validation (offline)
        working-directory: infra/bundles
        run: |
          set -uo pipefail
          # `bundle validate` schema-checks the config before it needs workspace auth.
          # We treat the auth error as expected (deferred) and fail only on schema issues.
          out="$(databricks bundle validate -t dev 2>&1 || true)"
          echo "${out}"
          if echo "${out}" | grep -iE 'unknown field|expected (sequence|mapping|string|integer|bool)'; then
            echo "::error::bundle schema validation failed"
            exit 1
          fi
          echo "bundle schema OK (workspace auth + deploy deferred)"
