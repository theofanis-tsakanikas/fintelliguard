# Dependabot — deliberately configured for a pinned reference implementation.
#
# `open-pull-requests-limit: 0` switches OFF *version-update* pull requests (the routine
# "bump X from 1.2 to 1.3" noise). That is intentional, not neglect: this repository is a
# reference implementation pinned to a stack the 592-case suite was validated against, and
# several of those pins must move together or not at all — XGBoost with the serialised model
# the promotion gate registered, PySpark with the DLT transforms, MLflow with the registry
# contract. Left on, the bumps pile up unreviewed, which reads far worse than a clean tree.
#
# What stays ON is the part that matters: **Dependabot security updates and alerts** (a
# separate repository setting) still raise a pull request when a dependency carries an actual
# advisory. Real vulnerabilities get a PR; cosmetic bumps do not.
#
# To resume routine updates, raise the limit (5 is a sane value), keep `interval: monthly`
# with `groups:` so an ecosystem arrives as one reviewable PR, and be aware that a model
# dependency bump needs `make test` plus a retrain to be meaningful — CI alone will not prove it.
version: 2

updates:
  # --- Python (the package and its dev extra) ---
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    groups:
      python:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "python"

  # --- GitHub Actions used across CI, bootstrap, deploy and destroy ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    groups:
      ci:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "ci"

  # --- Container image for the in-VPC streaming scorer ---
  - package-ecosystem: "docker"
    directory: "/deploy"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "docker"

  # --- Terraform providers: the three isolated layers + the state bootstrap ---
  - package-ecosystem: "terraform"
    directory: "/infra/aws"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    labels: ["dependencies", "terraform"]

  - package-ecosystem: "terraform"
    directory: "/infra/aws/bootstrap"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    labels: ["dependencies", "terraform"]

  - package-ecosystem: "terraform"
    directory: "/infra/databricks"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    labels: ["dependencies", "terraform"]

  - package-ecosystem: "terraform"
    directory: "/agents/bedrock/terraform"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    labels: ["dependencies", "terraform"]
