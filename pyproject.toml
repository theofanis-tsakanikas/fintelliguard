[project]
name = "fintelliguard"
version = "0.0.0"
description = "Real-time financial fraud detection & compliance platform"
requires-python = ">=3.11"

[project.optional-dependencies]
# Local dev/test tooling. PySpark needs a JDK (Java 8/11/17) on the machine — see
# pipelines/README.md. pandas + pyarrow back Spark's applyInPandas (gold features).
dev = [
    # Pinned so CI's ruff format/lint matches local exactly.
    "ruff==0.15.15",
    "pytest==8.4.2",
    "pyspark==3.5.3",
    # pyspark 3.5 imports distutils (removed in Python 3.12) — setuptools shims it.
    "setuptools",
    "pandas==2.2.2",
    "pyarrow==15.0.2",
    # ml/training. XGBoost needs the OpenMP runtime on macOS: `brew install libomp`.
    "xgboost==2.1.1",
    "scikit-learn==1.5.2",
    "mlflow-skinny==2.16.2",
    # agents/langgraph self-healing graph.
    "langgraph==1.0.2",
    # Durable healing state. Without a real checkpointer the retry bound and the action
    # budget are per-PROCESS, so a crash — the exact scenario durability is for — hands the
    # agent a fresh budget, and `build_checkpointer`'s promise to "fail loud rather than
    # fall back to an in-memory saver" was false: the next line returned InMemorySaver.
    "langgraph-checkpoint-sqlite==3.0.3",
    # dashboards/ provisioning YAML tests.
    "pyyaml==6.0.3",
    # Parses the Bedrock Terraform into a resource graph so the guardrail tests can check
    # that the control is ATTACHED and ENABLED, not that a string appears in a file — the
    # grep tests this replaced passed for the whole life of the detachment bug.
    #
    # Do NOT add checkov here. It depends on `bc-python-hcl2`, a fork that installs over
    # this package's `hcl2` directory and changes how the Terraform parses, which turns the
    # guardrail attachment tests red for reasons that have nothing to do with the
    # guardrail. `make iac-scan` runs checkov isolated (uvx/pipx); CI runs it in its own
    # container.
    "python-hcl2==7.3.1",
    # ml/serving local Prometheus exporter (tests assert the dashboard metric names).
    "prometheus-client==0.21.0",
]

# The one-command local end-to-end funnel (`make e2e` / docker compose): a self-sufficient
# runtime for the streaming scorer + simulator (the base project declares no runtime deps —
# the ML runs on Databricks, which provides them). Kept out of `dev` so the unit-test
# install stays lean and free of the native Kafka C-extension.
local = [
    "confluent-kafka==2.6.0",
    "prometheus-client==0.21.0",
    "xgboost==2.1.1",
    "scikit-learn==1.5.2",
    "pandas==2.2.2",
    "pyarrow==15.0.2",
]

[tool.setuptools.packages.find]
# Explicit discovery: the repo is flat-layout with several top-level dirs that
# are NOT Python packages (infra/, dashboards/, docs/) — without this, modern
# setuptools refuses the editable install with "Multiple top-level packages".
include = ["agents*", "ml*", "pipelines*", "simulator*"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", "infra"]

[tool.ruff.lint]
# pycodestyle (E), pyflakes (F), isort (I), pyupgrade (UP), bugbear (B),
# comprehensions (C4), naming (N)
select = ["E", "F", "I", "UP", "B", "C4", "N"]

[tool.ruff.lint.per-file-ignores]
# `functions as F` / `types as T` is the universal PySpark idiom.
"pipelines/**" = ["N812"]
"agents/databricks/**" = ["N812"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
