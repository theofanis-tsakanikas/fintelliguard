[project]
name = "fintelliguard"
version = "0.0.0"
description = "Real-time financial fraud detection & compliance platform"
requires-python = ">=3.9"

[tool.ruff]
target-version = "py39"
line-length = 100
extend-exclude = [".venv", "infra"]

[tool.ruff.lint]
# pycodestyle (E), pyflakes (F), isort (I), pyupgrade (UP), bugbear (B),
# comprehensions (C4), naming (N)
select = ["E", "F", "I", "UP", "B", "C4", "N"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
