# DLT medallion pipeline — runs the @dlt.* modules from pipelines/ into the
# fintelliguard catalog (bronze -> silver -> gold), per docs/data-flow.md.
#
# One pipeline references all three layer modules so cross-layer dlt.read works as the
# code is written. Splitting the streaming (continuous) and batch/IEEE (triggered) paths
# into separate pipelines, and packaging the modules as a wheel (the @dlt files use
# relative imports), are deploy-phase refinements.

resources:
  pipelines:
    medallion:
      name: fintelliguard-medallion
      catalog: ${var.catalog}

      # REQUIRED for a Unity Catalog pipeline — without it the deploy fails with
      # "The target schema field is required for UC pipelines".
      #
      # Every table in `pipelines/` is declared with a qualified name (`bronze.x`,
      # `silver.x`, `gold.x`), and DLT publishes those to the schema they name, inside
      # `catalog`. `target` is the DEFAULT for any table that does not qualify itself, so it
      # does not override the medallion layout CLAUDE.md mandates — it is the fallback the
      # API insists on having.
      target: ${var.pipeline_default_schema}
      continuous: ${var.pipeline_continuous}
      development: true
      photon: true
      edition: ADVANCED
      channel: CURRENT

      libraries:
        - file:
            path: ../../../pipelines/bronze/bronze_pipeline.py
        - file:
            path: ../../../pipelines/silver/silver_pipeline.py
        - file:
            path: ../../../pipelines/gold/gold_pipeline.py

      configuration:
        fintelliguard.catalog: ${var.catalog}
        # DLT configuration arrives as SPARK CONF on the pipeline cluster (not env
        # vars). The bronze layer reads these via pipelines/runtime_config.py.
        fintelliguard.raw_bucket: ${var.raw_bucket}
        fintelliguard.streaming_enabled: ${var.streaming_enabled}
