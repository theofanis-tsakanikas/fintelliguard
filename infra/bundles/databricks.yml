# FintelliGuard — Databricks Asset Bundle.
#
# Deploys ALL Databricks workloads: DLT medallion pipeline, the XGBoost get_fraud_score
# serving endpoint, Vector Search (endpoint + index), the copilot agent serving endpoint,
# Unity Catalog schemas/models with least-privilege grants, and a secret scope. The Genie
# space is created via a documented SDK fallback (scripts/genie_space.py) — Genie is not
# yet a DABs resource type.
#
# BUILD + offline-validate only. Variables marked "(deploy)" are set at deploy time from
# infra/databricks outputs / the workspace; `databricks bundle deploy` is deferred.

bundle:
  name: fintelliguard

# Build the repo as a wheel so the DLT pipeline's executors can import `pipelines.*` and
# `ml.features.*`. The gold transforms run per-card feature logic through Spark
# `applyInPandas`, which serializes those functions to WORKER processes; the driver-side
# sys.path bootstrap in the pipeline files does not reach a worker, so the workers failed
# with `ModuleNotFoundError: No module named 'pipelines'` (deploy run 29793184017). A wheel
# installed on the cluster puts the package on every worker's site-packages. This is the
# "package the modules as a wheel" refinement resources/pipelines.yml predicted.
artifacts:
  fintelliguard_wheel:
    type: whl
    build: python -m build --wheel
    # Relative to this bundle root (infra/bundles); the pyproject that defines the package
    # lives at the repo root.
    path: ../..

variables:
  catalog:
    description: Unity Catalog for FintelliGuard (infra/databricks catalog_name output).
    default: fintelliguard
  raw_bucket:
    description: >-
      (deploy) Raw S3 bucket the DLT Auto Loader reads IEEE-CIS from. Resolved from the
      infra/aws `raw_bucket_name` output at deploy time — the bucket carries an account-id
      suffix, so a hardcoded default would point Auto Loader at a non-existent path and
      schema inference would fail. Surfaced to the pipeline as `fintelliguard.raw_bucket`.
    default: ""
  streaming_enabled:
    description: >-
      Whether the Kafka stream lineage is part of the DLT pipeline. Default "false": the
      training deploy brings up neither MSK nor the simulator, and a Kafka source with no
      bootstrap servers cannot even be analyzed. Set "true" for a streaming run.
    default: "false"
  warehouse_id:
    description: (deploy) SQL warehouse id backing Genie / query_lakehouse.
    default: ""
  analyst_group:
    description: Unity Catalog group of fraud analysts (copilot + serving consumers).
    default: fintelliguard-analysts
  embedding_endpoint_name:
    description: >-
      Foundation-model embedding endpoint backing Vector Search. Was
      `databricks-bge-large-en`, which does not exist in this workspace — the index creation
      failed with ENDPOINT_NOT_FOUND (deploy run 29720269216). Databricks replaced BGE Large
      with GTE Large as the default English retrieval embedding; same 1024 dimensions, so the
      index shape is unchanged. Which foundation models are pre-provisioned varies by region,
      which is why the deploy now verifies this endpoint exists before the bundle runs
      instead of discovering it inside a bundle error.
    default: databricks-gte-large-en
  # The model name/version variables moved to `serving/databricks.yml` with the endpoints
  # that use them. Leaving them here would be four unused declarations that read as if this
  # bundle still serves something — and `fraud_model_version: "1"` in particular was a
  # default that quietly meant "serve whatever was registered first, gate or no gate".
  vector_endpoint_name:
    description: Vector Search endpoint name.
    default: fintelliguard-cases
  cases_source_table:
    description: Delta table of resolved fraud cases feeding the case index.
    default: fintelliguard.gold.resolved_cases
  pipeline_default_schema:
    description: >-
      Default schema for DLT tables that do not qualify themselves. Unity Catalog pipelines
      require this field. Our tables all declare bronze./silver./gold., so this is the
      fallback rather than the destination.
    default: bronze

  pipeline_continuous:
    description: DLT execution mode — true=continuous (streaming), false=triggered (batch).
    default: false
  # The Kafka/MSK bundle variables live in the dedicated streaming bundle
  # (infra/bundles/streaming), which is what the streaming stage deploys and runs. The DLT
  # medallion pipeline here consumes MSK only once its cluster carries the MSK instance profile
  # and its config sets fintelliguard.kafka_bootstrap + kafka_security_protocol — the live
  # Tier-1-reads-MSK wiring, deliberately a separate step from proving the private path (probe).
  # The consumer CAPABILITY is already in pipelines/runtime_config.py (default PLAINTEXT).

# The DLT sources live at the REPO ROOT (`pipelines/`), not under this bundle. By default a
# bundle syncs only files beneath its own root, so referencing them failed with "path ... is
# not contained in sync root path". `sync.paths` extends the root to cover them — listed
# explicitly rather than syncing the whole repository.
sync:
  paths:
    - .
    - ../../pipelines
    # The training job's import graph, traced rather than guessed: `train_fraud_scorer.py`
    # imports ml.training (load/train/gate/register) and ml.serving (the pyfunc it logs),
    # and ml.serving.scorer imports ml.features for the canonical schema. Syncing only `ml`
    # covers all three; listing them explicitly is how the seed job's missing package was
    # found the expensive way.
    - ../../ml

include:
  - resources/*.yml

targets:
  dev:
    mode: development
    default: true
    # No `workspace.host` here, deliberately.
    #
    # It used to carry `https://example.cloud.databricks.com` with a comment claiming the
    # DATABRICKS_HOST env var would override it at deploy. It does not — an explicit host in
    # the bundle config WINS over the environment, so `bundle deploy` authenticated against
    # a workspace that does not exist and failed with "cannot configure default
    # credentials", naming the placeholder back in its own error.
    #
    # Omitted, the CLI takes the host from DATABRICKS_HOST, which `deploy.yml` sets from
    # `terraform output workspace_url` — the layer that creates the workspace. `bundle
    # validate` in CI still schema-checks fine without it; it already tolerates the auth
    # error, which is all that is missing locally.
