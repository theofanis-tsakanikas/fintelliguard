# FintelliGuard — Databricks Asset Bundle.
#
# Deploys ALL Databricks workloads: DLT medallion pipeline, the XGBoost get_fraud_score
# serving endpoint, Vector Search (endpoint + index), the copilot agent serving endpoint,
# Unity Catalog schemas/models with least-privilege grants, and a secret scope. The Genie
# space is created via a documented SDK fallback (scripts/genie_space.py) — Genie is not
# yet a DABs resource type.
#
# BUILD + offline-validate only. Variables marked "(deploy)" are set at deploy time from
# infra/databricks outputs / the workspace; `databricks bundle deploy` is deferred.

bundle:
  name: fintelliguard

variables:
  catalog:
    description: Unity Catalog for FintelliGuard (infra/databricks catalog_name output).
    default: fintelliguard
  warehouse_id:
    description: (deploy) SQL warehouse id backing Genie / query_lakehouse.
    default: ""
  analyst_group:
    description: Unity Catalog group of fraud analysts (copilot + serving consumers).
    default: fintelliguard-analysts
  embedding_endpoint_name:
    description: Foundation-model embedding endpoint backing Vector Search.
    default: databricks-bge-large-en
  fraud_model_name:
    description: UC name of the XGBoost scorer model.
    default: fintelliguard.ml.fraud_scorer
  fraud_model_version:
    description: Served version of the scorer model.
    default: "1"
  agent_model_name:
    description: UC name of the copilot agent model.
    default: fintelliguard.ml.copilot_agent
  agent_model_version:
    description: Served version of the agent model.
    default: "1"
  vector_endpoint_name:
    description: Vector Search endpoint name.
    default: fintelliguard-cases
  cases_source_table:
    description: Delta table of resolved fraud cases feeding the case index.
    default: fintelliguard.gold.resolved_cases
  pipeline_continuous:
    description: DLT execution mode — true=continuous (streaming), false=triggered (batch).
    default: false

# The DLT sources live at the REPO ROOT (`pipelines/`), not under this bundle. By default a
# bundle syncs only files beneath its own root, so referencing them failed with "path ... is
# not contained in sync root path". `sync.paths` extends the root to cover them — listed
# explicitly rather than syncing the whole repository.
sync:
  paths:
    - .
    - ../../pipelines

include:
  - resources/*.yml

targets:
  dev:
    mode: development
    default: true
    # No `workspace.host` here, deliberately.
    #
    # It used to carry `https://example.cloud.databricks.com` with a comment claiming the
    # DATABRICKS_HOST env var would override it at deploy. It does not — an explicit host in
    # the bundle config WINS over the environment, so `bundle deploy` authenticated against
    # a workspace that does not exist and failed with "cannot configure default
    # credentials", naming the placeholder back in its own error.
    #
    # Omitted, the CLI takes the host from DATABRICKS_HOST, which `deploy.yml` sets from
    # `terraform output workspace_url` — the layer that creates the workspace. `bundle
    # validate` in CI still schema-checks fine without it; it already tolerates the auth
    # error, which is all that is missing locally.
